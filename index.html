<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⭐ 小寶貝集點系統</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Baloo+2:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --alston:#FF6B35;--alston-l:#FFE8DF;--alston-d:#D94F1A;
  --kiki:#9B5DE5;--kiki-l:#EFE6FF;--kiki-d:#7A3EC4;
  --admin:#0F172A;--admin-l:#E2E8F0;
  --parent:#2563EB;--parent-l:#DBEAFE;
  --child:#059669;--child-l:#D1FAE5;
  --bg:#FFF9F0;--card:#fff;--text:#1e1e2e;--muted:#94a3b8;
  --border:#F0E8DC;--shadow:0 4px 24px rgba(0,0,0,.07);--radius:20px;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Nunito',sans-serif;background:var(--bg);min-height:100vh;
  background-image:radial-gradient(circle at 15% 15%,#FFE8DF,transparent 35%),
                   radial-gradient(circle at 85% 85%,#EFE6FF,transparent 35%);}

.page{display:none;min-height:100vh;padding:24px 16px;}
.page.active{display:block;}

/* Topbar */
.topbar{max-width:960px;margin:0 auto 28px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.topbar-logo{font-family:'Baloo 2',cursive;font-size:1.5rem;font-weight:800;color:var(--text);}
.topbar-right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.role-chip{padding:5px 14px;border-radius:99px;font-size:.78rem;font-weight:800;}
.role-chip.admin {background:var(--admin-l);color:var(--admin);}
.role-chip.parent{background:var(--parent-l);color:var(--parent);}
.role-chip.child {background:var(--child-l);color:var(--child);}
.tb-btn{padding:7px 16px;border-radius:99px;border:2px solid var(--border);background:#fff;
  font-family:'Nunito',sans-serif;font-weight:700;font-size:.82rem;color:var(--muted);cursor:pointer;transition:all .15s;}
.tb-btn:hover{border-color:#9B5DE5;color:#9B5DE5;}
.tb-btn.danger:hover{border-color:#ef4444;color:#ef4444;}

/* Auth */
.auth-wrap{max-width:420px;margin:60px auto 0;}
.auth-hero{text-align:center;margin-bottom:36px;}
.auth-hero h1{font-family:'Baloo 2',cursive;font-size:2.6rem;font-weight:800;color:var(--text);margin-bottom:6px;}
.auth-hero p{color:var(--muted);font-weight:600;}
.auth-card{background:var(--card);border-radius:var(--radius);padding:32px 28px;box-shadow:var(--shadow);}
.auth-tabs{display:flex;margin-bottom:24px;background:#F8F9FF;border-radius:12px;padding:4px;gap:4px;}
.auth-tab{flex:1;padding:9px;border:none;border-radius:10px;font-family:'Nunito',sans-serif;
  font-weight:800;font-size:.9rem;cursor:pointer;transition:all .18s;background:transparent;color:var(--muted);}
.auth-tab.active{background:#fff;color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.08);}
.form-group{margin-bottom:16px;}
.form-label{display:block;font-weight:700;font-size:.85rem;color:var(--text);margin-bottom:6px;}
.form-input{width:100%;padding:11px 14px;border-radius:12px;border:2px solid var(--border);
  font-family:'Nunito',sans-serif;font-size:.95rem;font-weight:600;outline:none;
  transition:border-color .2s;background:#FAFAFA;color:var(--text);}
.form-input:focus{border-color:var(--kiki);}
.form-select{width:100%;padding:11px 14px;border-radius:12px;border:2px solid var(--border);
  font-family:'Nunito',sans-serif;font-size:.95rem;font-weight:600;outline:none;
  background:#FAFAFA;color:var(--text);cursor:pointer;}
.auth-btn{width:100%;padding:13px;border:none;border-radius:14px;font-family:'Nunito',sans-serif;
  font-size:1rem;font-weight:800;cursor:pointer;
  background:linear-gradient(135deg,var(--kiki),#F15BB5);color:#fff;margin-top:4px;
  transition:transform .15s,filter .15s;}
.auth-btn:hover{transform:scale(1.02);filter:brightness(1.05);}
.auth-btn:active{transform:scale(.98);}
.auth-err{color:#ef4444;font-size:.83rem;font-weight:700;margin-top:10px;min-height:20px;text-align:center;}
.auth-ok {color:#22c55e;font-size:.83rem;font-weight:700;margin-top:10px;min-height:20px;text-align:center;}

/* Cards */
.section-title{font-family:'Baloo 2',cursive;font-size:1.3rem;font-weight:800;color:var(--text);margin-bottom:16px;}
.cards-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;max-width:960px;margin:0 auto 28px;}
@media(max-width:600px){.cards-grid{grid-template-columns:1fr;}}

.kid-card{background:var(--card);border-radius:var(--radius);padding:24px 20px;box-shadow:var(--shadow);
  position:relative;overflow:hidden;border:2px solid transparent;transition:transform .2s,box-shadow .2s;}
.kid-card:hover{transform:translateY(-2px);box-shadow:0 8px 32px rgba(0,0,0,.11);}
.kid-card.alston{border-color:var(--alston-l);}
.kid-card.kiki  {border-color:var(--kiki-l);}
.kid-card::before{content:'';position:absolute;top:0;left:0;right:0;height:5px;border-radius:var(--radius) var(--radius) 0 0;}
.kid-card.alston::before{background:linear-gradient(90deg,var(--alston),#FFB347);}
.kid-card.kiki::before  {background:linear-gradient(90deg,var(--kiki),#F15BB5);}
.kid-avatar{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.8rem;margin-bottom:10px;}
.kid-card.alston .kid-avatar{background:var(--alston-l);}
.kid-card.kiki   .kid-avatar{background:var(--kiki-l);}
.kid-name{font-family:'Baloo 2',cursive;font-size:1.35rem;font-weight:800;margin-bottom:2px;}
.kid-card.alston .kid-name{color:var(--alston);}
.kid-card.kiki   .kid-name{color:var(--kiki);}
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:99px;font-size:.75rem;font-weight:800;margin-left:6px;}
.kid-card.alston .badge{background:var(--alston-l);color:var(--alston-d);}
.kid-card.kiki   .badge{background:var(--kiki-l);  color:var(--kiki-d);}
.pts-row{display:flex;align-items:baseline;gap:5px;margin:12px 0 8px;}
.pts-num{font-family:'Baloo 2',cursive;font-size:3rem;font-weight:800;line-height:1;}
.kid-card.alston .pts-num{color:var(--alston);}
.kid-card.kiki   .pts-num{color:var(--kiki);}
.pts-num.bump{animation:bump .4s cubic-bezier(.34,1.56,.64,1);}
@keyframes bump{0%{transform:scale(1)}50%{transform:scale(1.28)}100%{transform:scale(1)}}
.pts-label{font-size:.9rem;color:var(--muted);font-weight:700;}
.stars-row{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:16px;min-height:26px;}
.star-icon{font-size:1.1rem;animation:popIn .3s cubic-bezier(.34,1.56,.64,1);}
@keyframes popIn{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}

/* Controls */
.controls{display:flex;flex-direction:column;gap:9px;}
.reason-input{width:100%;padding:9px 13px;border-radius:11px;border:2px solid var(--border);
  font-family:'Nunito',sans-serif;font-size:.88rem;font-weight:600;outline:none;
  transition:border-color .2s;background:#FAFAFA;color:var(--text);resize:none;}
.kid-card.alston .reason-input:focus{border-color:var(--alston);}
.kid-card.kiki   .reason-input:focus{border-color:var(--kiki);}
.pt-row{display:flex;gap:8px;align-items:center;}
.pt-input{width:62px;padding:9px;border-radius:11px;border:2px solid var(--border);
  font-family:'Baloo 2',cursive;font-size:1rem;font-weight:700;text-align:center;outline:none;background:#FAFAFA;color:var(--text);}
.btn{flex:1;padding:10px 0;border:none;border-radius:11px;font-family:'Nunito',sans-serif;
  font-size:.92rem;font-weight:800;cursor:pointer;transition:transform .13s,filter .13s;
  display:flex;align-items:center;justify-content:center;gap:5px;}
.btn:hover{transform:scale(1.04);filter:brightness(1.06);}
.btn:active{transform:scale(.97);}
.btn-add{background:linear-gradient(135deg,#4ade80,#22c55e);color:#fff;}
.btn-sub{background:linear-gradient(135deg,#f87171,#ef4444);color:#fff;}

/* History */
.history-wrap{max-width:960px;margin:0 auto;}
.history-card{background:var(--card);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);}
.history-list{display:flex;flex-direction:column;gap:8px;margin-top:12px;}
.log-item{display:flex;align-items:flex-start;gap:10px;padding:10px 14px;border-radius:13px;
  font-size:.86rem;font-weight:600;animation:slideIn .3s ease;}
@keyframes slideIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:translateX(0)}}
.log-item.alston-log{background:var(--alston-l);}
.log-item.kiki-log  {background:var(--kiki-l);}
.log-left{display:flex;flex-direction:column;align-items:center;gap:3px;flex-shrink:0;}
.log-emo{font-size:1.2rem;}
.log-giver{font-size:.65rem;font-weight:800;padding:2px 6px;border-radius:99px;white-space:nowrap;}
.log-giver.parent{background:var(--parent-l);color:var(--parent);}
.log-giver.admin {background:var(--admin-l); color:var(--admin);}
.log-body{flex:1;}
.log-who{font-weight:800;font-size:.88rem;}
.alston-log .log-who{color:var(--alston-d);}
.kiki-log   .log-who{color:var(--kiki-d);}
.log-reason{color:var(--text);margin:2px 0;line-height:1.4;}
.log-time  {color:var(--muted);font-size:.75rem;}
.log-delta{font-family:'Baloo 2',cursive;font-size:1.25rem;font-weight:800;flex-shrink:0;}
.log-delta.pos{color:#22c55e;}
.log-delta.neg{color:#ef4444;}
.empty-state{text-align:center;padding:20px;color:var(--muted);font-weight:600;}
.clear-btn{display:block;margin:14px auto 0;padding:7px 18px;border:2px solid var(--border);
  border-radius:10px;background:transparent;font-family:'Nunito',sans-serif;
  font-weight:700;font-size:.82rem;color:var(--muted);cursor:pointer;transition:all .2s;}
.clear-btn:hover{background:#f8d7da;border-color:#ef4444;color:#ef4444;}

/* Child hero */
.child-hero{max-width:460px;margin:0 auto 28px;text-align:center;
  background:var(--card);border-radius:var(--radius);padding:32px 24px;box-shadow:var(--shadow);}
.child-big-avatar{width:96px;height:96px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:3rem;margin:0 auto 14px;}
.child-big-name{font-family:'Baloo 2',cursive;font-size:2rem;font-weight:800;margin-bottom:8px;}
.child-big-pts{font-family:'Baloo 2',cursive;font-size:4.5rem;font-weight:800;line-height:1;}
.child-stars{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin:12px 0 16px;}
.child-badge-big{display:inline-block;font-size:.95rem;font-weight:800;padding:7px 18px;border-radius:99px;}

/* Admin */
.admin-wrap{max-width:960px;margin:0 auto;}
.admin-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:24px;}
@media(max-width:600px){.admin-stats{grid-template-columns:1fr 1fr;}}
.stat-card{background:var(--card);border-radius:16px;padding:18px;box-shadow:var(--shadow);text-align:center;}
.stat-num{font-family:'Baloo 2',cursive;font-size:2rem;font-weight:800;}
.stat-label{font-size:.8rem;font-weight:700;color:var(--muted);margin-top:2px;}
.user-table{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;}
.user-table-head{display:grid;grid-template-columns:1fr 90px 110px 70px;padding:12px 18px;
  background:#F8F9FF;font-size:.8rem;font-weight:800;color:var(--muted);gap:8px;}
.user-row{display:grid;grid-template-columns:1fr 90px 110px 70px;padding:13px 18px;
  border-top:1px solid #F0F4F8;gap:8px;align-items:center;}
.user-row:hover{background:#FAFAFA;}
.user-email{font-weight:700;font-size:.85rem;color:var(--text);word-break:break-all;}
.user-sub  {font-weight:600;font-size:.78rem;color:var(--muted);}
.role-select{padding:5px 8px;border-radius:8px;border:2px solid var(--border);
  font-family:'Nunito',sans-serif;font-size:.8rem;font-weight:700;outline:none;cursor:pointer;background:#fff;}
.del-btn{padding:5px 10px;border:2px solid #fecaca;border-radius:8px;background:#fff;
  font-size:.78rem;font-weight:700;color:#ef4444;cursor:pointer;transition:all .15s;}
.del-btn:hover{background:#fef2f2;}
@media(max-width:600px){
  .user-table-head,.user-row{grid-template-columns:1fr 90px;}
  .user-table-head>*:nth-child(2),.user-row .user-sub,
  .user-table-head>*:nth-child(4),.user-row .del-btn{display:none;}
}

/* Toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);
  background:#1e1e2e;color:#fff;padding:10px 22px;border-radius:99px;
  font-weight:700;font-size:.88rem;z-index:999;
  transition:transform .3s cubic-bezier(.34,1.56,.64,1);pointer-events:none;}
.toast.show{transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<!-- ══ AUTH PAGE ══ -->
<div id="pg-auth" class="page active">
  <div class="auth-wrap">
    <div class="auth-hero">
      <h1>⭐ 集點系統</h1>
      <p>Alston & Kiki 的專屬獎勵平台</p>
    </div>
    <div class="auth-card">
      <div class="auth-tabs">
        <button class="auth-tab active" onclick="switchTab('login')">登入</button>
        <button class="auth-tab" onclick="switchTab('register')">註冊</button>
      </div>

      <!-- Login -->
      <div id="form-login">
        <div class="form-group">
          <label class="form-label">帳號名稱</label>
          <input class="form-input" id="login-name" type="text" placeholder="例如：爸爸 / Alston">
        </div>
        <div class="form-group">
          <label class="form-label">密碼</label>
          <input class="form-input" id="login-pw" type="password" placeholder="••••••••"
            onkeydown="if(event.key==='Enter')doLogin()">
        </div>
        <button class="auth-btn" onclick="doLogin()">登入</button>
        <div class="auth-err" id="login-err"></div>
      </div>

      <!-- Register -->
      <div id="form-register" style="display:none">
        <div class="form-group">
          <label class="form-label">帳號名稱</label>
          <input class="form-input" id="reg-name" type="text" placeholder="例如：爸爸 / Alston">
        </div>
        <div class="form-group">
          <label class="form-label">密碼</label>
          <input class="form-input" id="reg-pw" type="password" placeholder="至少 4 個字元">
        </div>
        <div class="form-group">
          <label class="form-label">身份</label>
          <select class="form-select" id="reg-role" onchange="onRoleChange()">
            <option value="parent">家長 👨‍👩‍👧</option>
            <option value="child">小孩 🧒</option>
            <option value="admin">管理員 👑</option>
          </select>
        </div>
        <div class="form-group" id="reg-kid-group" style="display:none">
          <label class="form-label">我是哪個小孩？</label>
          <select class="form-select" id="reg-kid"></select>
        </div>
        <div class="form-group" id="reg-admin-group" style="display:none">
          <label class="form-label">管理員密碼驗證</label>
          <input class="form-input" id="reg-admin-pw" type="password" placeholder="請輸入管理員驗證碼">
          <div style="font-size:.75rem;color:var(--muted);margin-top:4px;font-weight:600;">預設驗證碼：<strong>admin1234</strong>（可在設定中修改）</div>
        </div>
        <button class="auth-btn" onclick="doRegister()">建立帳號</button>
        <div class="auth-err" id="reg-err"></div>
        <div class="auth-ok"  id="reg-ok"></div>
      </div>
    </div>
  </div>
</div>

<!-- ══ PARENT DASHBOARD ══ -->
<div id="pg-parent" class="page">
  <div class="topbar">
    <span class="topbar-logo">⭐ 集點系統</span>
    <div class="topbar-right">
      <span class="role-chip parent" id="parent-chip">家長</span>
      <button class="tb-btn danger" onclick="doLogout()">登出</button>
    </div>
  </div>
  <div class="cards-grid" id="parent-cards"></div>
  <div class="history-wrap">
    <div class="history-card">
      <div class="section-title">📋 紀錄歷史</div>
      <div class="history-list" id="parent-history"></div>
      <button class="clear-btn" onclick="clearLogs()">🗑 清除所有紀錄</button>
    </div>
  </div>
</div>

<!-- ══ CHILD DASHBOARD ══ -->
<div id="pg-child" class="page">
  <div class="topbar">
    <span class="topbar-logo">⭐ 集點系統</span>
    <div class="topbar-right">
      <span class="role-chip child" id="child-chip">小孩</span>
      <button class="tb-btn danger" onclick="doLogout()">登出</button>
    </div>
  </div>
  <div class="child-hero">
    <div class="child-big-avatar" id="child-avatar">🚀</div>
    <div class="child-big-name"   id="child-name">Alston</div>
    <div class="pts-row" style="justify-content:center;margin:14px 0 4px;">
      <div class="child-big-pts" id="child-pts">0</div>
      <div class="pts-label" style="font-size:1.2rem;margin-left:8px;">點</div>
    </div>
    <div class="child-stars" id="child-stars"></div>
    <div class="child-badge-big" id="child-badge">🌱 新手</div>
  </div>
  <div class="history-wrap">
    <div class="history-card">
      <div class="section-title">📋 我的紀錄</div>
      <div class="history-list" id="child-history"></div>
    </div>
  </div>
</div>

<!-- ══ ADMIN DASHBOARD ══ -->
<div id="pg-admin" class="page">
  <div class="topbar">
    <span class="topbar-logo">⭐ 集點系統</span>
    <div class="topbar-right">
      <span class="role-chip admin">👑 管理員</span>
      <button class="tb-btn" onclick="showPage('pg-parent');renderParent()">家長視圖</button>
      <button class="tb-btn danger" onclick="doLogout()">登出</button>
    </div>
  </div>
  <div class="admin-wrap">
    <div class="section-title">👑 管理員後台</div>
    <div class="admin-stats" id="admin-stats">
      <div class="stat-card"><div class="stat-num" id="stat-users">0</div><div class="stat-label">總帳號數</div></div>
    </div>

    <div class="section-title">🎯 調整點數</div>
    <div class="cards-grid" id="admin-cards" style="margin-bottom:28px;"></div>

    <div class="section-title">👶 管理小孩</div>
    <div style="background:var(--card);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);margin-bottom:28px;">
      <div id="kid-list-admin" style="display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px;"></div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;border-top:2px solid var(--border);padding-top:16px;">
        <div style="flex:1;min-width:120px;">
          <label class="form-label">小孩名字</label>
          <input class="form-input" id="new-kid-name" type="text" placeholder="例如：小明">
        </div>
        <div style="flex:0;min-width:80px;">
          <label class="form-label">頭像</label>
          <input class="form-input" id="new-kid-emoji" type="text" placeholder="🌟" maxlength="2" style="text-align:center;font-size:1.3rem;">
        </div>
        <button class="btn btn-add" style="flex:0;padding:11px 20px;white-space:nowrap;margin-bottom:0;" onclick="addKid()">➕ 新增小孩</button>
      </div>
    </div>

    <div class="section-title">👥 使用者管理</div>
    <div class="user-table">
      <div class="user-table-head">
        <span>帳號</span><span>身份</span><span>角色</span><span>刪除</span>
      </div>
      <div id="user-list"></div>
    </div>

    <div style="margin-top:24px;">
      <div class="section-title">🔑 修改管理員驗證碼</div>
      <div style="background:var(--card);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;">
        <div style="flex:1;min-width:160px;">
          <label class="form-label">新驗證碼</label>
          <input class="form-input" id="new-admin-code" type="password" placeholder="輸入新驗證碼">
        </div>
        <button class="btn btn-add" style="flex:0;padding:11px 20px;white-space:nowrap;" onclick="changeAdminCode()">儲存</button>
      </div>
    </div>

    <div style="margin-top:16px;">
      <button class="clear-btn" onclick="clearLogs()">🗑 清除所有紀錄</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ══════════════════════════════════════════════
//  Storage helpers
// ══════════════════════════════════════════════
const DB_KEY    = 'kidspts_db_v3';
const SESSION_KEY = 'kidspts_session';

function loadDB() {
  try {
    return JSON.parse(localStorage.getItem(DB_KEY)) || defaultDB();
  } catch { return defaultDB(); }
}
function saveDB(db) { localStorage.setItem(DB_KEY, JSON.stringify(db)); }
function defaultDB() {
  return {
    users: [
      { id:'u1', name:'爸爸',   pw: hashPw('dad1234'),   role:'parent', kid:null },
      { id:'u2', name:'媽媽',   pw: hashPw('mom1234'),   role:'parent', kid:null },
      { id:'u3', name:'Alston', pw: hashPw('alston123'), role:'child',  kid:'alston' },
      { id:'u4', name:'Kiki',   pw: hashPw('kiki123'),   role:'child',  kid:'kiki' },
      { id:'u5', name:'管理員', pw: hashPw('admin1234'), role:'admin',  kid:null },
    ],
    kids: [
      { id:'alston', name:'Alston', emoji:'🚀', colorIdx:0 },
      { id:'kiki',   name:'Kiki',   emoji:'🌸', colorIdx:1 },
    ],
    points: { alston: 0, kiki: 0 },
    logs: [],
    adminCode: hashPw('admin1234'),
    nextId: 6,
    nextKidId: 3
  };
}

// Simple hash (not cryptographic, just obfuscation)
function hashPw(pw) {
  let h = 0;
  for (let i = 0; i < pw.length; i++) h = Math.imul(31, h) + pw.charCodeAt(i) | 0;
  return 'h' + Math.abs(h).toString(36);
}

// ══════════════════════════════════════════════
//  Session
// ══════════════════════════════════════════════
let currentUser = null;

function saveSession(user) {
  currentUser = user;
  localStorage.setItem(SESSION_KEY, JSON.stringify({ id: user.id }));
}
function clearSession() {
  currentUser = null;
  localStorage.removeItem(SESSION_KEY);
}
function restoreSession() {
  try {
    const s = JSON.parse(localStorage.getItem(SESSION_KEY));
    if (!s) return false;
    const db   = loadDB();
    const user = db.users.find(u => u.id === s.id);
    if (!user) return false;
    currentUser = user;
    return true;
  } catch { return false; }
}

// ══════════════════════════════════════════════
//  Boot
// ══════════════════════════════════════════════
if (restoreSession()) {
  populateKidSelect();
  routeToDashboard(currentUser);
} else {
  populateKidSelect();
}

// ══════════════════════════════════════════════
//  Page router
// ══════════════════════════════════════════════
function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function routeToDashboard(user) {
  if      (user.role === 'admin')  { showPage('pg-admin');  renderAdmin(); }
  else if (user.role === 'parent') { showPage('pg-parent'); renderParent(); }
  else                             { showPage('pg-child');  renderChild(); }
}

// ══════════════════════════════════════════════
//  Auth tab
// ══════════════════════════════════════════════
function switchTab(tab) {
  const tabs = document.querySelectorAll('.auth-tab');
  tabs[0].classList.toggle('active', tab==='login');
  tabs[1].classList.toggle('active', tab==='register');
  document.getElementById('form-login').style.display    = tab==='login'    ? 'block':'none';
  document.getElementById('form-register').style.display = tab==='register' ? 'block':'none';
  document.getElementById('login-err').textContent = '';
  document.getElementById('reg-err').textContent   = '';
  document.getElementById('reg-ok').textContent    = '';
}
function onRoleChange() {
  const role = document.getElementById('reg-role').value;
  document.getElementById('reg-kid-group').style.display   = role==='child' ? 'block':'none';
  document.getElementById('reg-admin-group').style.display = role==='admin' ? 'block':'none';
}

// ══════════════════════════════════════════════
//  Register
// ══════════════════════════════════════════════
function doRegister() {
  const name    = document.getElementById('reg-name').value.trim();
  const pw      = document.getElementById('reg-pw').value;
  const role    = document.getElementById('reg-role').value;
  const kid     = document.getElementById('reg-kid').value;
  const adminPw = document.getElementById('reg-admin-pw').value;
  const errEl   = document.getElementById('reg-err');
  const okEl    = document.getElementById('reg-ok');
  errEl.textContent = ''; okEl.textContent = '';

  if (!name)      { errEl.textContent='請填寫帳號名稱'; return; }
  if (pw.length < 4) { errEl.textContent='密碼至少 4 個字元'; return; }

  const db = loadDB();

  // Check duplicate name
  if (db.users.find(u => u.name === name)) { errEl.textContent='此名稱已被使用'; return; }

  // Admin verification
  if (role === 'admin') {
    if (hashPw(adminPw) !== db.adminCode) { errEl.textContent='管理員驗證碼錯誤'; return; }
  }

  const newUser = {
    id:   'u' + db.nextId++,
    name, pw: hashPw(pw), role,
    kid:  role==='child' ? kid : null
  };
  db.users.push(newUser);
  saveDB(db);

  okEl.textContent = '✅ 帳號建立成功！請切換到登入頁面登入。';
}

// ══════════════════════════════════════════════
//  Login
// ══════════════════════════════════════════════
function doLogin() {
  const name  = document.getElementById('login-name').value.trim();
  const pw    = document.getElementById('login-pw').value;
  const errEl = document.getElementById('login-err');
  errEl.textContent = '';

  if (!name || !pw) { errEl.textContent='請填寫帳號和密碼'; return; }

  const db   = loadDB();
  const user = db.users.find(u => u.name === name && u.pw === hashPw(pw));

  if (!user) { errEl.textContent='帳號或密碼錯誤'; return; }

  saveSession(user);
  routeToDashboard(user);
}

// ══════════════════════════════════════════════
//  Logout
// ══════════════════════════════════════════════
function doLogout() {
  clearSession();
  showPage('pg-auth');
  document.getElementById('login-name').value = '';
  document.getElementById('login-pw').value   = '';
  document.getElementById('login-err').textContent = '';
}

// ══════════════════════════════════════════════
//  Kid card HTML builder
// ══════════════════════════════════════════════
function buildKidCard(kidData, pts, suffix) {
  const sfx   = suffix ? `-${suffix}` : '';
  const id    = kidData.id;
  const p     = KID_COLORS[kidData.colorIdx % KID_COLORS.length];
  const color = p.color, light = p.light, dark = p.dark;
  const emoji = kidData.emoji || '⭐';
  const name  = kidData.name;
  return `
  <div class="kid-card" style="border-color:${light}">
    <div style="position:absolute;top:0;left:0;right:0;height:5px;border-radius:20px 20px 0 0;background:${color};"></div>
    <div class="kid-avatar" style="background:${light}">${emoji}</div>
    <div class="kid-name" style="color:${color}">${name}
      <span class="badge" id="badge-${id}${sfx}" style="background:${light};color:${dark}">${getBadge(pts)}</span>
    </div>
    <div class="pts-row">
      <div class="pts-num" id="pts-${id}${sfx}" style="color:${color}">${pts}</div>
      <div class="pts-label">點</div>
    </div>
    <div class="stars-row" id="stars-${id}${sfx}"></div>
    <div class="controls">
      <textarea class="reason-input" id="reason-${id}${sfx}" rows="2"
        placeholder="備注：因為什麼表現？✏️"
        onfocus="this.style.borderColor='${color}'" onblur="this.style.borderColor=''"></textarea>
      <div class="pt-row">
        <input class="pt-input" id="amt-${id}${sfx}" type="number" value="1" min="1" max="99">
        <button class="btn btn-add" onclick="addPts('${id}',1,'${suffix||''}')">➕ 加點</button>
        <button class="btn btn-sub" onclick="addPts('${id}',-1,'${suffix||''}')">➖ 減點</button>
      </div>
    </div>
  </div>`;
}

function populateKidSelect() {
  const db  = loadDB();
  const sel = document.getElementById('reg-kid');
  if (!sel) return;
  sel.innerHTML = getKids(db).map(k => `<option value="${k.id}">${k.emoji||'⭐'} ${k.name}</option>`).join('');
}

// ══════════════════════════════════════════════
//  Render parent dashboard
// ══════════════════════════════════════════════
function renderParent() {
  const db   = loadDB();
  const kids = getKids(db);
  document.getElementById('parent-chip').textContent = `👋 ${currentUser.name}`;
  const grid = document.getElementById('parent-cards');
  grid.innerHTML = kids.map(k => buildKidCard(k, db.points[k.id]||0, '')).join('');
  kids.forEach(k => renderStars(document.getElementById(`stars-${k.id}`), db.points[k.id]||0));
  renderLogs('parent-history', null, db.logs, db);
}

// ══════════════════════════════════════════════
//  Render child dashboard
// ══════════════════════════════════════════════
function renderChild() {
  const db    = loadDB();
  const kidId = currentUser.kid || getKids(db)[0]?.id || 'alston';
  const meta  = getKidMeta(kidId, db);
  const pts   = db.points[kidId] || 0;
  document.getElementById('child-chip').textContent       = `👋 ${currentUser.name}`;
  document.getElementById('child-avatar').textContent      = meta.emoji;
  document.getElementById('child-avatar').style.background = meta.light;
  document.getElementById('child-name').textContent        = meta.name;
  document.getElementById('child-name').style.color        = meta.color;
  document.getElementById('child-pts').textContent         = pts;
  document.getElementById('child-pts').style.color         = meta.color;
  document.getElementById('child-badge').textContent       = getBadge(pts);
  document.getElementById('child-badge').style.background  = meta.light;
  document.getElementById('child-badge').style.color       = meta.color;
  renderStars(document.getElementById('child-stars'), pts);
  renderLogs('child-history', kidId, db.logs, db);
}

// ══════════════════════════════════════════════
//  Render admin dashboard
// ══════════════════════════════════════════════
function renderAdmin() {
  const db   = loadDB();
  const kids = getKids(db);
  // Stats
  const statsEl = document.getElementById('admin-stats');
  statsEl.innerHTML = `<div class="stat-card"><div class="stat-num">${db.users.length}</div><div class="stat-label">總帳號數</div></div>`
    + kids.map(k => {
        const p = KID_COLORS[k.colorIdx % KID_COLORS.length];
        return `<div class="stat-card"><div class="stat-num" style="color:${p.color}">${db.points[k.id]||0}</div><div class="stat-label">${k.name} 點數</div></div>`;
      }).join('');
  // Kid cards
  const adminCards = document.getElementById('admin-cards');
  adminCards.innerHTML = kids.map(k => buildKidCard(k, db.points[k.id]||0, 'a')).join('');
  kids.forEach(k => renderStars(document.getElementById(`stars-${k.id}-a`), db.points[k.id]||0));
  // Kid management chips
  const kidListEl = document.getElementById('kid-list-admin');
  kidListEl.innerHTML = kids.length ? kids.map(k => {
    const p = KID_COLORS[k.colorIdx % KID_COLORS.length];
    return `<span style="display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:99px;background:${p.light};color:${p.color};font-weight:800;font-size:.88rem;">
      ${k.emoji||'⭐'} ${k.name}
      <button onclick="removeKid('${k.id}')" style="border:none;background:none;cursor:pointer;color:${p.dark};font-size:.9rem;padding:0 2px;">✕</button>
    </span>`;
  }).join('') : '<span style="color:var(--muted);font-size:.88rem;font-weight:600;">尚無小孩</span>';
  // User list
  const list = document.getElementById('user-list');
  list.innerHTML = db.users.map(u => {
    const kidLabel = u.role==='child' ? (getKidMeta(u.kid, db).name||u.kid||'?') : '—';
    return `<div class="user-row">
      <div><div class="user-email">${u.name}</div><div class="user-sub">${u.role==='child'?`🧒 ${kidLabel}`:''}</div></div>
      <div class="user-sub">${{admin:'👑 管理員',parent:'👨‍👩 家長',child:'🧒 小孩'}[u.role]||u.role}</div>
      <select class="role-select" onchange="changeRole('${u.id}',this.value)">
        <option value="parent" ${u.role==='parent'?'selected':''}>👨‍👩 家長</option>
        <option value="child"  ${u.role==='child' ?'selected':''}>🧒 小孩</option>
        <option value="admin"  ${u.role==='admin' ?'selected':''}>👑 管理員</option>
      </select>
      <button class="del-btn" onclick="deleteUser('${u.id}')">刪除</button>
    </div>`;
  }).join('');
}

// ══════════════════════════════════════════════
//  Points
// ══════════════════════════════════════════════
function addPts(kid, dir, suffix) {
  if (!currentUser) return;
  const sfx    = suffix ? `-${suffix}` : '';
  const amt    = parseInt(document.getElementById(`amt-${kid}${sfx}`).value) || 1;
  const reason = document.getElementById(`reason-${kid}${sfx}`).value.trim();
  const delta  = dir * amt;
  const db     = loadDB();
  db.points[kid] = (db.points[kid] || 0) + delta;
  const now  = new Date();
  const time = now.toLocaleDateString('zh-TW')+' '+now.toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'});
  db.logs.push({ kid, delta, reason, time, ts: Date.now(), giverName: currentUser.name, giverRole: currentUser.role });
  saveDB(db);
  const el = document.getElementById(`pts-${kid}${sfx}`);
  if (el) { el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
  document.getElementById(`reason-${kid}${sfx}`).value = '';
  if (currentUser.role === 'admin') renderAdmin(); else renderParent();
  const meta = getKidMeta(kid, db);
  toast(`${delta>0?'➕':'➖'} ${meta.name} ${delta>0?'+':''}${delta} 點！`);
}

function clearLogs() {
  if (!confirm('確定要清除所有紀錄嗎？點數會保留。')) return;
  const db = loadDB(); db.logs = []; saveDB(db);
  if (currentUser.role === 'admin') renderAdmin(); else renderParent();
  toast('✅ 紀錄已清除');
}

// ══════════════════════════════════════════════
//  Admin operations
// ══════════════════════════════════════════════
function changeRole(uid, newRole) {
  const db = loadDB(), user = db.users.find(u => u.id === uid);
  if (user) { user.role = newRole; saveDB(db); renderAdmin(); toast('✅ 角色已更新'); }
}
function deleteUser(uid) {
  const db = loadDB(), user = db.users.find(u => u.id === uid);
  if (!user) return;
  if (!confirm(`確定要刪除「${user.name}」嗎？`)) return;
  db.users = db.users.filter(u => u.id !== uid);
  saveDB(db); renderAdmin(); toast('🗑 使用者已刪除');
}
function changeAdminCode() {
  const newCode = document.getElementById('new-admin-code').value;
  if (!newCode || newCode.length < 4) { toast('❌ 驗證碼至少 4 個字元'); return; }
  const db = loadDB(); db.adminCode = hashPw(newCode); saveDB(db);
  document.getElementById('new-admin-code').value = '';
  toast('✅ 管理員驗證碼已更新');
}
function addKid() {
  const name  = document.getElementById('new-kid-name').value.trim();
  const emoji = document.getElementById('new-kid-emoji').value.trim() || '⭐';
  if (!name) { toast('❌ 請輸入小孩名字'); return; }
  const db  = loadDB();
  db.kids   = db.kids || [];
  if (db.kids.find(k => k.name === name)) { toast('❌ 此名字已存在'); return; }
  const id  = 'kid_' + ((db.nextKidId = (db.nextKidId||3) + 1));
  db.kids.push({ id, name, emoji, colorIdx: db.kids.length });
  db.points[id] = 0;
  saveDB(db);
  document.getElementById('new-kid-name').value  = '';
  document.getElementById('new-kid-emoji').value = '';
  populateKidSelect();
  renderAdmin();
  toast(`✅ 已新增：${emoji} ${name}`);
}
function removeKid(kidId) {
  const db      = loadDB();
  const kidData = (db.kids||[]).find(k => k.id === kidId);
  if (!kidData) return;
  if (!confirm(`確定要移除「${kidData.name}」嗎？`)) return;
  db.kids = db.kids.filter(k => k.id !== kidId);
  saveDB(db); populateKidSelect(); renderAdmin();
  toast(`🗑 已移除：${kidData.name}`);
}

// ══════════════════════════════════════════════
//  Render helpers
// ══════════════════════════════════════════════
// Kid colors pool
const KID_COLORS = [
  { color:'#FF6B35', light:'#FFE8DF', dark:'#D94F1A' },
  { color:'#9B5DE5', light:'#EFE6FF', dark:'#7A3EC4' },
  { color:'#0EA5E9', light:'#E0F2FE', dark:'#0369A1' },
  { color:'#10B981', light:'#D1FAE5', dark:'#065F46' },
  { color:'#F59E0B', light:'#FEF3C7', dark:'#92400E' },
  { color:'#EC4899', light:'#FCE7F3', dark:'#9D174D' },
];

function getKidMeta(kid, db) {
  const kidData = (db.kids||[]).find(k => k.id === kid);
  if (!kidData) return { emoji:'⭐', name:kid, color:'#888', light:'#eee', dark:'#555' };
  const palette = KID_COLORS[kidData.colorIdx % KID_COLORS.length];
  return { emoji: kidData.emoji||'⭐', name: kidData.name, ...palette };
}

function getKids(db) { return db.kids || []; }

function renderLogs(containerId, filterKid, logs, db) {
  const el = document.getElementById(containerId);
  if (!el) return;
  db = db || loadDB();
  let filtered = [...logs].reverse();
  if (filterKid) filtered = filtered.filter(l => l.kid === filterKid);
  if (!filtered.length) { el.innerHTML='<div class="empty-state">還沒有紀錄，快去為寶貝加點吧！🌟</div>'; return; }
  el.innerHTML = filtered.map(log => {
    const meta = getKidMeta(log.kid, db);
    const giverCls   = log.giverRole==='admin'?'admin':'parent';
    const giverLabel = log.giverRole==='admin'?`👑 ${log.giverName}`:`👨‍👩 ${log.giverName}`;
    return `<div class="log-item" style="background:${meta.light}">
      <div class="log-left">
        <span class="log-emo">${meta.emoji}</span>
        <span class="log-giver ${giverCls}">${giverLabel}</span>
      </div>
      <div class="log-body">
        <div class="log-who" style="color:${meta.dark}">${meta.name}</div>
        <div class="log-reason">${log.reason||'（未填備注）'}</div>
        <div class="log-time">${log.time}</div>
      </div>
      <div class="log-delta ${log.delta>0?'pos':'neg'}">${log.delta>0?'+':''}${log.delta}</div>
    </div>`;
  }).join('');
}

function getBadge(pts) {
  if (pts<0)   return '😢 加油！';
  if (pts<10)  return '🌱 新手';
  if (pts<30)  return '⭐ 進步中';
  if (pts<60)  return '🌟 優秀';
  if (pts<100) return '🏅 超棒';
  return '🏆 傳奇！';
}
function renderStars(el, pts) {
  const capped = Math.min(Math.max(pts,0),20);
  el.innerHTML='';
  for(let i=0;i<capped;i++){
    const s=document.createElement('span');
    s.className='star-icon';s.textContent='⭐';s.style.animationDelay=`${i*.02}s`;
    el.appendChild(s);
  }
  if(pts>20){
    const m=document.createElement('span');
    m.className='star-icon';m.textContent=`+${pts-20}`;
    m.style.fontSize='.75rem';m.style.color='#888';m.style.alignSelf='center';
    el.appendChild(m);
  }
}
let toastTimer;
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg;el.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2400);
}
</script>
